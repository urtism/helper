[project]
name = "helper-next"
version = "0.1.0"
description = "Local web interface prototype for Helper"
readme = "README.md"
requires-python = ">=3.6"
dependencies = [
    "fastapi>=0.83,<0.84",
    "uvicorn>=0.16,<0.17",
]

[project.scripts]
helper-next = "helper_next.cli:main"

[build-system]
requires = ["setuptools>=40", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
helper_next = ["web/static/*"]
